</style>

  const sh = el("button", "chip", t("share")); sh.onclick = async () => { try { if (navigator.share) await navigator.share({title: clean(g.title), url: link(g)}); else { await navigator.clipboard.writeText(link(g)); toast(t("copied")); } } catch(e){} };
  let cb = null; const en = endOf(g);
  if (en && en > Date.now()) { cb = el("a", "chip", t("cal")); cb.style.cssText = "display:inline-block;margin-inline-start:6px;text-decoration:none"; cb.href = ics(g, en); cb.download = "offer-" + g.id + ".ics"; }
  const src = el("a", "", "via GamerPower.com"); src.href = g.gamerpower_url || "https://www.gamerpower.com"; src.target = "_blank"; src.rel = "noopener"; src.style.cssText = "display:block;margin-top:10px;color:var(--mute);font-size:.82rem";
  d.append(gt, sh, ...(cb ? [cb] : []), src); s.append(im, d); $("sh").classList.add("open");
}
$("sh").onclick = e => { if (e.target === $("sh")) $("sh").classList.remove("open"); };
addEventListener("keydown", e => { if (e.key === "Escape") $("sh").classList.remove("open"); });

function render() {
  const g = $("g"); g.textContent = ""; let n = 0;
  if (tab === "soft") {
    g.style.display = "block";
    const h = el("h2", "", t("soft_h")), l = el("div", "links");
    SOFT.forEach(s => { const a = el("a"); a.href = s.u; a.target = "_blank"; a.rel = "noopener"; a.append(el("span", "", s.n), el("small", "", s[lang])); l.append(a); });
    const h2 = el("h2", "", t("store_h")), l2 = el("div", "links");
    STORELINKS.forEach(s => { const a = el("a"); a.href = s.u; a.target = "_blank"; a.rel = "noopener"; a.append(el("span", "", s.n)); l2.append(a); });
    g.append(h, l, h2, l2); $("st").textContent = ""; return;
  }
  g.style.display = "";
  if (tab === "deals") {
    if (!dealsLoaded) { for (let k = 0; k < 6; k++) g.append(el("div", "sk")); $("st").textContent = t("load"); return; }
    deals.filter(d => !q || d.title.toLowerCase().includes(q)).forEach(d => { g.append(dealCard(d)); n++; });
    $("st").textContent = n ? n + t("cnt") : t("empty"); $("st").className = ""; return;
  }
  if (loading) { for (let k = 0; k < 6; k++) g.append(el("div", "sk")); $("st").textContent = t("load"); return; }
  const pr = PLAT.find(p => p[0] === plat);
  let list = offers.filter(o => (tab !== "saved" || favs.includes(o.id)) && (plat === "all" || (pr && pr[1].test(o.platforms || ""))) && (!TYPES[type] || TYPES[type].test(o.type || "")) && (!hide || !done.includes(o.id)) && (!q || o.title.toLowerCase().includes(q)));
  const far = 9e15, by = {pop: (a, b) => (b.users || 0) - (a.users || 0), end: (a, b) => (endOf(a) || far) - (endOf(b) || far), val: (a, b) => worth(b) - worth(a), new: (a, b) => new Date(b.published_date) - new Date(a.published_date)};
  list.sort(by[sort]).forEach(o => { g.append(card(o)); n++; });
  $("st").textContent = (offline ? t("offline") + " · " : "") + (n ? n + t("cnt") : t("empty")); $("st").className = offline ? "off" : "";
}

function count(el2, to, pre) { const t0 = performance.now(); (function f(t1) { const p = Math.min(1, (t1 - t0) / 700); el2.textContent = pre + Math.round(to * p); if (p < 1) requestAnimationFrame(f); })(t0); }
function stats() { count($("n"), offers.length, ""); count($("w"), Math.round(offers.reduce((s, o) => s + worth(o), 0)), "$"); }

async function load(silent) {
  if (!silent && !offers.length) { loading = true; render(); }
  try {
    const r = await fetch("https://www.gamerpower.com/api/giveaways"), j = await r.json();
    const list = Array.isArray(j) ? j.filter(o => o.status !== "Expired") : [];
    offline = false; offers = list; checkNew(list);
    store.set("fl-cache", list.slice(0, 150).map(o => ({...o, description: (o.description || "").slice(0, 400), instructions: (o.instructions || "").slice(0, 400)})));
  } catch(e) { offline = true; }
  loading = false; controls(); render(); stats();
}
async function loadDeals() {
  if (dealsLoaded) return;
  try { const r = await fetch("https://www.cheapshark.com/api/1.0/deals?onSale=1&sortBy=Savings&upperPrice=10&pageSize=40"); deals = await r.json(); } catch(e) { deals = []; }
  dealsLoaded = true; render();
}

// ---- الإشعارات ----
let notif = store.get("fl-notif", {new: false, rem: false}), reminded = store.get("fl-rem", []);
const cacheJ = async (k, v) => { try { const c = await caches.open("fl-data"); if (v === undefined) { const r = await c.match(k); return r ? await r.json() : null; } await c.put(k, new Response(JSON.stringify(v))); } catch(e){ return null; } };
function syncSW() { cacheJ("cfg", {notif, favs, done, lang}); }
async function notify(title, body, tag) {
  try { const reg = await navigator.serviceWorker.ready; await reg.showNotification(title, {body, tag, icon: "icon-192.png", badge: "icon-192.png", lang, dir: lang === "ar" ? "rtl" : "ltr", data: {url: "./"}}); }
  catch(e) { try { new Notification(title, {body, tag}); } catch(x){} }
}
function banner(txt) {
  const b = $("bn"); b.textContent = txt + "  ›"; b.style.display = "block";
  b.onclick = () => { b.style.display = "none"; tab = "offers"; sort = "new"; controls(); render(); scrollTo({top: 0, behavior: "smooth"}); };
  clearTimeout(banner.x); banner.x = setTimeout(() => b.style.display = "none", 9000);
}
async function checkNew(list) {
  const old = store.get("fl-seen", null), prev = [...new Set([...(old || []), ...((await cacheJ("seen")) || [])])], ids = list.map(o => o.id);
  store.set("fl-seen", ids); cacheJ("seen", ids);
  if (old === null && !prev.length || !notif.new) return;
  const fresh = list.filter(o => !prev.includes(o.id)); if (!fresh.length) return;
  const one = fresh.length === 1, title = one ? "🎁 " + clean(fresh[0].title) : t("newn") + fresh.length;
  const body = one ? label(fresh[0]) + (worth(fresh[0]) ? " · $" + worth(fresh[0]).toFixed(2) : "") : fresh.slice(0, 3).map(o => clean(o.title)).join("، ");
  banner(title); if (Notification.permission === "granted") notify(title, body, "fl-new");
}
function checkRem() {
  if (!notif.rem) return;
  offers.forEach(o => {
    const e = endOf(o); if (!e || !favs.includes(o.id) || done.includes(o.id) || reminded.includes(o.id)) return;
    const ms = e - Date.now(); if (ms <= 0 || ms > 3600000) return;
    reminded.push(o.id); store.set("fl-rem", reminded); cacheJ("rem", reminded);
    banner(t("rem_t") + " · " + clean(o.title)); if (Notification.permission === "granted") notify(t("rem_t"), t("rem_b") + clean(o.title), "fl-rem-" + o.id);
  });
}
async function ask() {
  if (!("Notification" in window)) { toast(t("np_unsup")); return false; }
  if (Notification.permission === "default") await Notification.requestPermission();
  if (Notification.permission !== "granted") { toast(t("np_denied")); return false; }
  return true;
}
async function flip(k) { if (!notif[k] && !(await ask())) return; notif[k] = !notif[k]; store.set("fl-notif", notif); syncSW(); panel(); periodic(); checkRem(); }
async function periodic() {
  try {
    const reg = await navigator.serviceWorker.ready; if (!("periodicSync" in reg)) return;
    if (notif.new || notif.rem) { const s = await navigator.permissions.query({name: "periodic-background-sync"}); if (s.state === "granted") await reg.periodicSync.register("fl-check", {minInterval: 3600000}); }
    else await reg.periodicSync.unregister("fl-check");
  } catch(e){}
}
function panel() {
  const p = $("np"); p.textContent = ""; p.append(el("h2", "", t("np_t")));
  [["new", "np_new"], ["rem", "np_rem"]].forEach(([k, s]) => { const b = el("button", "chip", t(s)); b.setAttribute("aria-pressed", notif[k]); b.setAttribute("role", "switch"); b.setAttribute("aria-checked", notif[k]); b.onclick = () => flip(k); p.append(b); });
  const ts = el("button", "chip", t("np_test")); ts.onclick = async () => { if (await ask()) notify(t("test_t"), t("test_b"), "fl-test"); };
  p.append(ts, el("p", "", t("np_note")));
  const on = notif.new || notif.rem; $("bell").textContent = on ? "🔔" : "🔕"; $("bell").classList.toggle("on", on);
}
$("bell").onclick = () => $("np").classList.toggle("open");
function ics(g, e) {
  const f = d => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const s = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//FreeLoot//EN", "BEGIN:VEVENT", "UID:fl-" + g.id + "@freeloot", "DTSTAMP:" + f(new Date()), "DTSTART:" + f(e), "DTEND:" + f(new Date(+e + 900000)),
    "SUMMARY:" + clean(g.title).replace(/[,;\n]/g, " ") + " - " + t("free"), "DESCRIPTION:" + link(g), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + t("rem_b"), "TRIGGER:-PT1H", "END:VALARM", "END:VEVENT", "END:VCALENDAR"];
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(s.join("\r\n"));
}

applyLang(); controls(); render(); stats(); load(); panel(); syncSW(); checkRem(); periodic();
cacheJ("rem").then(r => { if (r) reminded = [...new Set([...reminded, ...r])]; });
setInterval(() => { if (!document.hidden) load(true); }, 600000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
